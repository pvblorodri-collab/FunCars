<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E53935">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FunCars">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>FunCars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --doman-red: #E53935;
    --doman-red-dark: #B0191C;
    --sky-1: #FFE98A;
    --sky-2: #FFC46B;
    --sky-3: #FF8A5B;
    --road:   #3B3B4F;
    --road-stripe: #FFE066;
    --cream:  #FFF8EC;
    --ink:    #1E1E2A;
    --muted:  #6b6b7a;
    --accent-blue: #4FC3F7;
    --accent-green: #66BB6A;
    --accent-purple: #AB47BC;
    --accent-yellow: #FFC107;
    --card-bg: rgba(255,255,255,0.72);
    --card-border: rgba(255,255,255,0.9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: "Fredoka", -apple-system, system-ui, sans-serif;
    color: var(--ink);
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }

  /* ====================  TOP BAR  ==================== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 10px;
  }
  .brand {
    font-weight: 700;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
  }
  .brand .fun { color: var(--doman-red); }
  .brand .cars { color: var(--road); }
  .wallet {
    background: #fff;
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  .wallet .coin { font-size: 1.2rem; }

  /* ====================  HERO  ==================== */
  .hero-wrap {
    text-align: center;
    padding: 10px 20px 0;
  }
  .hero-wrap .scene {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 180px;
    margin: 0 auto;
  }
  .hero-wrap .scene svg { width: 100%; height: 100%; display: block; }
  .hero-wrap .car-wrap {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }
  .road-stripes { animation: dash 1s linear infinite; }
  @keyframes dash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -48; }
  }

  /* ====================  BATCH GRID  ==================== */
  .section-title {
    font-weight: 600;
    font-size: 1.15rem;
    padding: 20px 24px 10px;
    color: var(--ink);
    opacity: 0.85;
  }
  .batches {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    padding: 4px 20px 40px;
  }
  .batch-tile {
    background: var(--card-bg);
    backdrop-filter: blur(8px);
    border: 2px solid var(--card-border);
    border-radius: 22px;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08);
    position: relative;
    overflow: hidden;
    min-height: 150px;
  }
  .batch-tile:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .batch-tile[data-state="mastered"] {
    background: linear-gradient(145deg, #FFF2B8, #FFC46B);
    border-color: #FFD54F;
    cursor: default;
  }
  .batch-tile[data-state="cooldown"] {
    background: rgba(255,255,255,0.4);
    border-color: rgba(255,255,255,0.5);
    opacity: 0.75;
    cursor: not-allowed;
  }
  .batch-tile[data-state="cooldown"]:active { transform: none; }
  .batch-tile[data-state="cooldown"] .tile-name,
  .batch-tile[data-state="cooldown"] .tile-words { color: var(--muted); }
  .batch-tile[data-state="inactive"] {
    background: rgba(255,255,255,0.35);
    border-color: rgba(255,255,255,0.5);
    opacity: 0.65;
    box-shadow: 0 4px 0 rgba(0,0,0,0.04);
  }
  .batch-tile[data-state="inactive"] .tile-name,
  .batch-tile[data-state="inactive"] .tile-words { color: var(--muted); }
  .batch-tile[data-state="inactive"] .activate-chip {
    background: var(--doman-red);
    color: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    width: fit-content;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .deactivate-btn {
    position: absolute;
    top: 8px; right: 8px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: none;
    cursor: pointer;
    font-weight: 700;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
    z-index: 2;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
  }
  .deactivate-btn:active { transform: translateY(1px); }

  .active-counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0 20px 4px;
  }
  .active-counter.warn { background: #fff; color: var(--doman-red); }
  .cooldown-overlay {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--road);
    background: rgba(255,255,255,0.65);
    padding: 4px 10px;
    border-radius: 999px;
    width: fit-content;
  }
  .cooldown-overlay .clock { font-size: 1rem; }
  .batch-tile .tile-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .batch-tile .tile-emoji {
    font-size: 1.6rem;
    line-height: 1;
  }
  .batch-tile .tile-badge {
    background: #fff;
    color: var(--ink);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .batch-tile[data-state="mastered"] .tile-badge {
    background: var(--doman-red);
    color: #fff;
  }
  .batch-tile .tile-name {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }
  .batch-tile .tile-words {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.3;
  }
  .batch-tile .tile-progress {
    margin-top: auto;
    height: 6px;
    background: rgba(0,0,0,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .batch-tile .tile-progress-fill {
    height: 100%;
    background: var(--doman-red);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .batch-tile[data-state="mastered"] .tile-progress-fill {
    background: var(--doman-red-dark);
  }

  /* ====================  SESSION  ==================== */
  #session {
    background: #FFFDF7;
    position: relative;
  }
  #session .session-inner {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    padding: 0;
  }
  #cardText {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--doman-red);
    font-weight: 600;
    text-align: center;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  #cardText.text-mode {
    font-size: clamp(5rem, 26vw, 20rem);
  }
  #cardText.image-mode {
    font-size: clamp(8rem, 40vw, 28rem);
    color: var(--ink);
    font-weight: 400;
  }
  #passLabel {
    position: absolute;
    top: 90px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    display: inline-flex;
    justify-content: center;
  }
  #passLabel .lbl {
    background: rgba(0,0,0,0.06);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
  }
  #progress {
    position: absolute;
    top: 24px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
  }
  .pass-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #F0E6D2;
    transition: all 0.3s ease;
  }
  .pass-dot.done { background: var(--doman-red); }
  .pass-dot.active {
    background: var(--doman-red);
    transform: scale(1.3);
    box-shadow: 0 0 0 6px rgba(229,57,53,0.18);
  }
  #sessionTitle {
    position: absolute;
    top: 56px; left: 0; right: 0;
    text-align: center;
    color: var(--muted);
    font-weight: 500;
    font-size: 0.95rem;
    pointer-events: none;
  }

  /* ====================  DONE  ==================== */
  #done .done-inner {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
  }
  #done .trophy { font-size: 5.5rem; animation: pop 0.5s ease; }
  @keyframes pop {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  #done .msg {
    font-size: 1.6rem;
    font-weight: 600;
  }
  #done .reward {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--ink);
    background: #fff;
    border-radius: 28px;
    padding: 14px 28px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08);
  }
  #done .reward .coin { color: var(--doman-red); }
  #done .mastered-badge {
    background: linear-gradient(145deg, #FFF2B8, #FFC46B);
    border: 2px solid #FFD54F;
    color: var(--doman-red-dark);
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 1rem;
  }

  /* ====================  BOTONES  ==================== */
  .big-btn {
    position: relative;
    background: var(--doman-red);
    color: #fff;
    border: none;
    border-radius: 32px;
    padding: 18px 36px;
    font-size: 1.25rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
    box-shadow: 0 8px 0 var(--doman-red-dark), 0 12px 20px rgba(176,25,28,0.28);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .big-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 var(--doman-red-dark), 0 4px 8px rgba(176,25,28,0.2);
  }
  .big-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: rgba(30,30,42,0.55);
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 500;
  }

  /* ====================  CONFETTI  ==================== */
  .confetti {
    position: fixed;
    top: -10px;
    width: 10px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    animation: fall 2.4s linear forwards;
    z-index: 999;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  /* ====================  LOADING  ==================== */
  .loading { text-align: center; padding: 40px; color: var(--muted); font-weight: 500; }

  /* ====================  TAB BAR  ==================== */
  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-top: 2px solid rgba(255,255,255,0.9);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0));
    z-index: 50;
    display: none;
  }
  body.show-tabs .tabbar { display: flex; }
  body.show-tabs .screen.active { padding-bottom: 80px; }
  .tabbar button {
    background: transparent;
    border: none;
    padding: 6px 24px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--muted);
    font-weight: 500;
    font-size: 0.78rem;
  }
  .tabbar button .ico { font-size: 1.5rem; line-height: 1; }
  .tabbar button[aria-current="page"] {
    color: var(--doman-red);
    font-weight: 700;
  }

  /* ====================  WORDS SCREEN  ==================== */
  #words .words-header {
    text-align: center;
    padding: 4px 20px 16px;
  }
  #words .words-count {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  #words .words-sub {
    color: var(--muted);
    font-weight: 500;
    font-size: 0.95rem;
    margin-top: 4px;
  }
  .words-group {
    padding: 10px 20px 6px;
  }
  .words-group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .words-group-head .emoji { font-size: 1.3rem; }
  .words-group-head .name { font-weight: 700; font-size: 1.05rem; }
  .words-group-head .state {
    margin-left: auto;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
  }
  .words-group-head .state[data-s="mastered"] {
    background: var(--doman-red);
    color: #fff;
  }
  .words-group .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
  .word-card {
    background: #FFFDF7;
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
    color: var(--doman-red);
    font-size: 1.2rem;
    letter-spacing: -0.01em;
    box-shadow: 0 4px 0 rgba(0,0,0,0.06);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .word-card .wc-emoji { font-size: 2rem; line-height: 1; }
  .word-card.speaking .wc-emoji { filter: brightness(0) invert(1); }
  .word-card:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.06);
  }
  .word-card.speaking {
    background: var(--doman-red);
    color: #fff;
    box-shadow: 0 4px 0 var(--doman-red-dark);
  }
  .word-empty {
    text-align: center;
    padding: 40px 24px;
    color: var(--muted);
    font-weight: 500;
    line-height: 1.5;
  }
  .word-empty .big-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }

  /* ====================  GAME  ==================== */
  #game { background: #1E1E2A; color: #fff; }
  #game .game-wrap {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .game-hud {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 10px;
    pointer-events: none;
  }
  .game-hud .hud-left,
  .game-hud .hud-right { pointer-events: auto; }
  .hud-chip {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 600;
    font-size: 1rem;
    color: #fff;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .hud-chip.btn { cursor: pointer; border: none; font-family: inherit; }
  .hud-chip.score { background: rgba(255,255,255,0.18); font-size: 1.1rem; }

  .game-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 20px;
    background: rgba(30,30,42,0.85);
    backdrop-filter: blur(4px);
  }
  .game-overlay.active { display: flex; }
  .game-overlay h2 {
    font-size: 2rem;
    font-weight: 700;
    margin: 0;
  }
  .game-overlay .sub {
    font-size: 1rem;
    opacity: 0.75;
    max-width: 320px;
  }
  .game-overlay .score-badge {
    background: #fff;
    color: var(--ink);
    border-radius: 24px;
    padding: 14px 24px;
    font-weight: 700;
    font-size: 1.6rem;
    box-shadow: 0 8px 0 rgba(0,0,0,0.3);
  }
  .game-overlay .big-emoji { font-size: 4.5rem; line-height: 1; }
  .game-overlay .btn-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .game-overlay .btn-ghost { color: rgba(255,255,255,0.65); }

  /* Picker de juegos */
  .game-picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 480px;
    padding: 0 8px;
  }
  .game-pick {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 18px;
    padding: 16px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .game-pick:disabled { opacity: 0.4; cursor: not-allowed; }
  .game-pick .pico { font-size: 2.4rem; line-height: 1; }
  .game-pick .pname { font-weight: 700; }
  .game-pick .pdesc { font-weight: 500; font-size: 0.78rem; opacity: 0.7; }
  .game-pick:active:not(:disabled) { transform: translateY(2px); }
</style>
</head>
<body>

<!-- ====================  HOME  ==================== -->
<section id="home" class="screen active">
  <div class="topbar">
    <div class="brand"><span class="fun">Fun</span><span class="cars">Cars</span></div>
    <div class="wallet"><span id="walletCount">0</span> <span class="coin">🪙</span></div>
  </div>

  <div class="hero-wrap">
    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="70"  cy="40" rx="30" ry="10" fill="#fff" opacity="0.75"/>
        <ellipse cx="330" cy="30" rx="40" ry="12" fill="#fff" opacity="0.75"/>
        <path d="M0,160 Q140,70 240,140 T420,120 L420,220 L0,220 Z" fill="#FFB380" opacity="0.4"/>
        <rect x="0" y="160" width="420" height="60" fill="#3B3B4F"/>
        <line class="road-stripes" x1="0" y1="190" x2="420" y2="190"
              stroke="#FFE066" stroke-width="4" stroke-dasharray="20 12"/>
      </svg>
      <div class="car-wrap">
        <svg width="140" height="80" viewBox="0 0 160 90" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="80" cy="82" rx="60" ry="5" fill="#000" opacity="0.18"/>
          <path d="M12,60 Q12,42 32,38 L52,22 Q58,16 68,16 L108,16 Q118,16 124,22 L140,38 Q152,42 152,56 L152,66 Q152,72 146,72 L18,72 Q12,72 12,66 Z"
                fill="#E53935"/>
          <path d="M34,38 L54,24 Q58,20 64,20 L104,20 Q110,20 114,24 L134,38 Z"
                fill="#B0191C" opacity="0.9"/>
          <path d="M58,24 L68,24 L68,38 L50,38 Z" fill="#FFF" opacity="0.9"/>
          <path d="M72,24 L104,24 L108,38 L72,38 Z" fill="#FFF" opacity="0.9"/>
          <circle cx="142" cy="56" r="4" fill="#FFEB3B"/>
          <rect x="10" y="60" width="8" height="8" rx="2" fill="#8E1618"/>

<script>
(() => {
  // ============================================================
  //  CONFIG
  // ============================================================
  const CARD_MS       = 1000;
  const PAUSE_MS      = 150;
  const PASS_PAUSE_MS = 500;
  const PASSES        = 5;
  const COINS_PER_SESSION = 3;
  const SESSIONS_TO_MASTER = 15;
  const MAX_ACTIVE_BATCHES = 2;
  const STATE_KEY = "funcars.state.v1";

  // Estrategia de modos por pase (ADR-19):
  //   pase 1 texto · 2 imagen · 3 texto · 4 imagen · 5 texto
  //   intercalado → cada palabra se escucha pegada a su escritura
  //   y a su imagen alternativamente, reforzando el enlace triple.
  const PASS_MODES = ["text", "image", "text", "image", "text"];

  // Modo rápido para pruebas: añade ?fast a la URL y el cooldown
  // pasa de 8h a 10s (sólo para probar la mecánica sin esperar).
  const FAST_MODE = new URLSearchParams(location.search).has("fast");
  const COOLDOWN_MS = FAST_MODE ? 10 * 1000 : 8 * 60 * 60 * 1000;

  // Emoji por lote (visual, cero semántica — solo decorar la tile)
  const BATCH_EMOJI = {
    "mi-mundo":          "🌞",
    "mi-cuerpo":         "👁️",
    "animales-cercanos": "🐶",
    "animales-granja":   "🐄",
    "comida":            "🍎",
    "naturaleza":        "🌙",
    "objetos-casa":      "🛋️",
    "colores":           "🎨",
    "afectos":           "💞",
    "acciones":          "🏃"
  };

  // ============================================================
  //  STATE (localStorage)
  // ============================================================
  function newState() {
    return { v: 1, coins: 0, sessions: [], active_batches: [] };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return newState();
      const s = JSON.parse(raw);
      if (!s || s.v !== 1 || !Array.isArray(s.sessions)) return newState();
      if (!Array.isArray(s.active_batches)) s.active_batches = [];
      return s;
    } catch (e) { return newState(); }
  }
  function isActive(s, batchId) {
    return s.active_batches.includes(batchId);
  }
  function activeCount(s) { return s.active_batches.length; }
  function activateBatch(s, batchId) {
    if (isActive(s, batchId)) return true;
    if (activeCount(s) >= MAX_ACTIVE_BATCHES) return false;
    s.active_batches = [...s.active_batches, batchId];
    saveState(s);
    return true;
  }
  function deactivateBatch(s, batchId) {
    s.active_batches = s.active_batches.filter(id => id !== batchId);
    saveState(s);
  }
  function saveState(s) {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function sessionsForBatch(s, batchId) {
    return s.sessions.filter(x => x.batch_id === batchId).length;
  }
  function lastSessionAt(s, batchId) {
    let last = null;
    for (const x of s.sessions) {
      if (x.batch_id !== batchId) continue;
      const t = Date.parse(x.at);
      if (!isNaN(t) && (last === null || t > last)) last = t;
    }
    return last;
  }
  function isMastered(s, batchId) {
    return sessionsForBatch(s, batchId) >= SESSIONS_TO_MASTER;
  }
  function cooldownRemainingMs(s, batchId, now) {
    const last = lastSessionAt(s, batchId);
    if (last === null) return 0;
    const r = (last + COOLDOWN_MS) - now;
    return r > 0 ? r : 0;
  }
  function batchStatus(s, batchId, now) {
    if (isMastered(s, batchId)) return "mastered";
    if (!isActive(s, batchId))  return "inactive";
    if (cooldownRemainingMs(s, batchId, now) > 0) return "cooldown";
    return "available";
  }
  function formatRemaining(ms) {
    const totalSec = Math.ceil(ms / 1000);
    if (totalSec < 60)      return totalSec + "s";
    const totalMin = Math.ceil(ms / 60000);
    if (totalMin < 60) {
      const sec = Math.ceil((ms % 60000) / 1000);
      return totalMin + "m " + (sec > 0 ? sec + "s" : "");
    }
    const h = Math.floor(ms / 3600000);
    const m = Math.ceil((ms % 3600000) / 60000);
    return h + "h " + (m > 0 ? m + "m" : "");
  }
  function completeSession(s, batchId) {
    const wasMastered = isMastered(s, batchId);
    s.sessions.push({ batch_id: batchId, at: new Date().toISOString() });
    s.coins += COINS_PER_SESSION;
    const nowMastered = isMastered(s, batchId);
    // Dominar un lote libera su slot de "activo"
    if (!wasMastered && nowMastered) {
      s.active_batches = s.active_batches.filter(id => id !== batchId);
    }
    saveState(s);
    return { justMastered: !wasMastered && nowMastered };
  }
  function resetState() {
    localStorage.removeItem(STATE_KEY);
  }

  let state = loadState();
  let catalog = null;       // { language, batches: [...] }
  let currentBatch = null;  // batch obj seleccionado para la sesión

  // ============================================================
  //  DOM REFS
  // ============================================================
  const screens = {
    home:    document.getElementById("home"),
    words:   document.getElementById("words"),
    game:    document.getElementById("game"),
    session: document.getElementById("session"),
    done:    document.getElementById("done")
  };
  const SCREENS_WITH_TABS = new Set(["home", "words", "game"]);
  const walletCount   = document.getElementById("walletCount");
  const walletCountW  = document.getElementById("walletCountW");
  const batchGrid     = document.getElementById("batchGrid");
  const activeCounter = document.getElementById("activeCounter");
  const wordsCount    = document.getElementById("wordsCount");
  const wordsBody     = document.getElementById("wordsBody");
  const cardText      = document.getElementById("cardText");
  const progress      = document.getElementById("progress");
  const sessionTitle  = document.getElementById("sessionTitle");
  const passLabelInner = document.getElementById("passLabelInner");
  const doneMsg       = document.getElementById("doneMsg");
  const masteredBadge = document.getElementById("masteredBadge");
  const btnAgain      = document.getElementById("btnAgain");
  const btnReset      = document.getElementById("btnReset");

  // ============================================================
  //  VOICE
  // ============================================================
  let voice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return null;
    const prefs = [
      v => v.lang === "es-ES" && !v.localService,
      v => v.lang === "es-ES",
      v => v.lang.startsWith("es"),
      v => true
    ];
    for (const p of prefs) { const v = vs.find(p); if (v) return v; }
    return vs[0];
  }
  function warmUpVoices() {
    return new Promise(resolve => {
      let v = pickVoice();
      if (v) { voice = v; return resolve(voice); }
      speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); resolve(voice); };
    });
  }
  function speak(text) {
    if (!text || !("speechSynthesis" in window)) return;
    try {
      // Vaciar la cola, pero dar un micro-delay antes del nuevo speak:
      // sin este tick, Chrome a veces ignora el speak() que llega
      // demasiado pegado al cancel() y la palabra "no suena".
      speechSynthesis.cancel();
      setTimeout(() => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "es-ES";
          u.rate = 1.0;
          u.pitch = 1.0;
          if (voice) u.voice = voice;
          speechSynthesis.speak(u);
        } catch (e) {}
      }, 12);
    } catch (e) {}
  }

  // Workaround del bug de Chrome: tras ~15s hablando seguido el motor
  // se congela hasta que haces un pause/resume. Lo mantenemos vivo
  // sólo durante una sesión (lo apagamos al terminar).
  let ttsPump = null;
  function startTTSPump() {
    stopTTSPump();
    if (!("speechSynthesis" in window)) return;
    ttsPump = setInterval(() => {
      if (speechSynthesis.speaking) {
        speechSynthesis.pause();
        speechSynthesis.resume();
      }
    }, 10000);
  }
  function stopTTSPump() {
    if (ttsPump) { clearInterval(ttsPump); ttsPump = null; }
  }

  // ============================================================
  //  UTIL
  // ============================================================
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }
  function show(name) {
    for (const k of Object.keys(screens)) screens[k].classList.remove("active");
    screens[name].classList.add("active");
    window.scrollTo(0, 0);
    document.body.classList.toggle("show-tabs", SCREENS_WITH_TABS.has(name));
    // Marcar la pestaña activa
    document.querySelectorAll(".tabbar button").forEach(b => {
      if (b.dataset.tab === name) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    if (name === "home") startHomeTicker(); else stopHomeTicker();
    if (name === "words") renderWordsScreen();
    if (name === "game") enterGameScreen(); else leaveGameScreen();
  }

  // ============================================================
  //  RENDER HOME
  // ============================================================
  function renderWallet() {
    walletCount.textContent = state.coins;
    walletCountW.textContent = state.coins;
  }

  // ============================================================
  //  RENDER WORDS SCREEN
  // ============================================================
  function renderWordsScreen() {
    if (!catalog) {
      wordsBody.innerHTML = `<div class="loading">Cargando…</div>`;
      wordsCount.textContent = "0";
      return;
    }
    // Un lote aporta sus palabras a "Mis palabras" cuando tiene ≥1 sesión.
    const groups = catalog.batches
      .map(b => ({ b, done: sessionsForBatch(state, b.id) }))
      .filter(g => g.done > 0);

    const totalWords = groups.reduce((acc, g) => acc + g.b.cards.length, 0);
    wordsCount.textContent = totalWords;

    if (groups.length === 0) {
      wordsBody.innerHTML = `
        <div class="word-empty">
          <span class="big-emoji">📘</span>
          Completa una sesión en <b>Inicio</b> para empezar a ver aquí las palabras aprendidas.
        </div>`;
      return;
    }

    wordsBody.innerHTML = "";
    for (const { b, done } of groups) {
      const mastered = done >= SESSIONS_TO_MASTER;
      const stateLabel = mastered ? "Dominado" : "Aprendiendo " + done + "/" + SESSIONS_TO_MASTER;
      const emoji = BATCH_EMOJI[b.id] || "📘";

      const group = document.createElement("div");
      group.className = "words-group";
      group.innerHTML = `
        <div class="words-group-head">
          <span class="emoji">${emoji}</span>
          <span class="name">${b.name}</span>
          <span class="state" data-s="${mastered ? "mastered" : "learning"}">${stateLabel}</span>
        </div>
        <div class="word-grid"></div>
      `;
      const grid = group.querySelector(".word-grid");
      for (const c of b.cards) {
        const w = document.createElement("div");
        w.className = "word-card";
        w.innerHTML = `<span class="wc-emoji">${c.emoji || ""}</span><span class="wc-text">${c.text}</span>`;
        w.addEventListener("click", () => tapWord(w, c.text));
        grid.appendChild(w);
      }
      wordsBody.appendChild(group);
    }
  }

  function tapWord(el, text) {
    speak(text);
    el.classList.add("speaking");
    setTimeout(() => el.classList.remove("speaking"), 600);
  }

  function renderActiveCounter() {
    const n = activeCount(state);
    activeCounter.textContent = n + " de " + MAX_ACTIVE_BATCHES + " lotes activos";
    activeCounter.classList.toggle("warn", n === 0);
  }

  function renderBatchGrid() {
    if (!catalog) {
      batchGrid.innerHTML = `<div class="loading">Cargando lotes…</div>`;
      return;
    }
    renderActiveCounter();
    const now = Date.now();
    batchGrid.innerHTML = "";
    for (const b of catalog.batches) {
      const done = sessionsForBatch(state, b.id);
      const pct  = Math.min(100, Math.round((done / SESSIONS_TO_MASTER) * 100));
      const words = b.cards.map(c => c.text).join(" · ");
      const status = batchStatus(state, b.id, now);
      const remaining = cooldownRemainingMs(state, b.id, now);

      let badge, extra = "", corner = "";
      if (status === "mastered") {
        badge = "✓ Dominado";
      } else if (status === "cooldown") {
        badge = done + "/" + SESSIONS_TO_MASTER;
        extra = `<div class="cooldown-overlay"><span class="clock">⏱</span> ${formatRemaining(remaining)}</div>`;
        corner = `<button class="deactivate-btn" data-deactivate aria-label="Desactivar">✕</button>`;
      } else if (status === "available") {
        badge = done + "/" + SESSIONS_TO_MASTER;
        corner = `<button class="deactivate-btn" data-deactivate aria-label="Desactivar">✕</button>`;
      } else { // inactive
        badge = `<span class="activate-chip">➕ Activar</span>`;
      }

      const tile = document.createElement("div");
      tile.className = "batch-tile";
      tile.dataset.state = status;
      tile.dataset.batchId = b.id;
      tile.innerHTML = `
        ${corner}
        <div class="tile-top">
          <div class="tile-emoji">${BATCH_EMOJI[b.id] || "📘"}</div>
          <div class="tile-badge">${badge}</div>
        </div>
        <div class="tile-name">${b.name}</div>
        <div class="tile-words">${words}</div>
        ${extra}
        <div class="tile-progress">
          <div class="tile-progress-fill" style="width:${pct}%"></div>
        </div>
      `;

      // Clicks sobre el botón de desactivar (si existe)
      const deactBtn = tile.querySelector("[data-deactivate]");
      if (deactBtn) {
        deactBtn.addEventListener("click", ev => {
          ev.stopPropagation();
          if (!confirm("¿Desactivar \"" + b.name + "\"? Su progreso se conserva y puedes reactivarlo cuando quieras.")) return;
          deactivateBatch(state, b.id);
          renderBatchGrid();
        });
      }

      // Click sobre la tile
      if (status === "available") {
        tile.addEventListener("click", () => startSession(b));
      } else if (status === "inactive") {
        tile.addEventListener("click", () => {
          const ok = activateBatch(state, b.id);
          if (!ok) {
            alert("Ya tienes " + MAX_ACTIVE_BATCHES + " lotes activos. Desactiva uno (botón ✕) antes de activar otro.");
            return;
          }
          renderBatchGrid();
        });
      }
      batchGrid.appendChild(tile);
    }
  }

  // Ticker: refresca contadores de cooldown cada segundo cuando la home
  // está visible, parando al salir de la home para no gastar batería.
  let tickerId = null;
  function startHomeTicker() {
    if (tickerId !== null) return;
    tickerId = setInterval(() => {
      if (!screens.home.classList.contains("active")) {
        stopHomeTicker();
        return;
      }
      // Sólo re-render si hay algún cooldown activo
      const now = Date.now();
      const anyCd = catalog && catalog.batches.some(b =>
        batchStatus(state, b.id, now) === "cooldown"
      );
      if (anyCd) renderBatchGrid();
    }, 1000);
  }
  function stopHomeTicker() {
    if (tickerId !== null) { clearInterval(tickerId); tickerId = null; }
  }

  // ============================================================
  //  SESSION LOOP
  // ============================================================
  function renderProgress(currentPass) {
    progress.innerHTML = "";
    for (let i = 0; i < PASSES; i++) {
      const d = document.createElement("div");
      d.className = "pass-dot" +
        (i < currentPass ? " done" :
         i === currentPass ? " active" : "");
      progress.appendChild(d);
    }
  }

  let running = false;
  async function startSession(batch) {
    if (running) return;
    currentBatch = batch;
    sessionTitle.textContent = batch.name;
    await warmUpVoices();
    try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch(e){}
    runSession();
  }

  function setCardMode(mode) {
    cardText.classList.toggle("text-mode",  mode === "text");
    cardText.classList.toggle("image-mode", mode === "image");
    passLabelInner.textContent = mode === "image" ? "Imagen" : "Lectura";
  }

  async function runSession() {
    running = true;
    show("session");
    startTTSPump();

    const cards = currentBatch.cards; // {text, emoji}
    for (let pass = 0; pass < PASSES; pass++) {
      renderProgress(pass);
      const mode = PASS_MODES[pass] || "text";
      setCardMode(mode);
      const order = shuffle(cards);
      for (const c of order) {
        if (mode === "image") {
          cardText.textContent = c.emoji || c.text;
        } else {
          cardText.textContent = c.text;
        }
        speak(c.text);
        await sleep(CARD_MS);
        cardText.textContent = "";
        await sleep(PAUSE_MS);
      }
      await sleep(PASS_PAUSE_MS);
    }
    renderProgress(PASSES);
    running = false;
    stopTTSPump();
    try { speechSynthesis.cancel(); } catch(e){}

    const { justMastered } = completeSession(state, currentBatch.id);
    renderWallet();

    doneMsg.textContent = "¡" + currentBatch.name + " completado!";
    masteredBadge.style.display = justMastered ? "inline-block" : "none";
    show("done");
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ["#E53935","#4FC3F7","#66BB6A","#FFC46B","#AB47BC","#FFEB3B"];
    for (let i = 0; i < 36; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 0.4) + "s";
      c.style.animationDuration = (1.8 + Math.random() * 1.2) + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }

  // ============================================================
  //  HANDLERS
  // ============================================================
  btnAgain.addEventListener("click", () => {
    renderBatchGrid();
    renderWallet();
    show("home");
  });

  document.querySelectorAll(".tabbar button").forEach(b => {
    b.addEventListener("click", () => {
      const target = b.dataset.tab;
      if (target === "home") { renderBatchGrid(); renderWallet(); }
      show(target);
    });
  });
  btnReset.addEventListener("click", () => {
    if (!confirm("¿Reiniciar todo el progreso? Se borrarán monedas y sesiones.")) return;
    resetState();
    state = loadState();
    speechSynthesis.cancel();
    renderBatchGrid();
    renderWallet();
    show("home");
  });

  // ============================================================
  //  BOOT
  // ============================================================
  // ============================================================
  //  GAME SHELL (canvas + overlays + registry)
  // ============================================================
  const canvas       = document.getElementById("gameCanvas");
  const ctx          = canvas.getContext("2d");
  const overlayPicker= document.getElementById("overlayPicker");
  const overlayOver  = document.getElementById("overlayOver");
  const noCoinsHint  = document.getElementById("noCoinsHint");
  const gamePicker   = document.getElementById("gamePicker");
  const btnRetry     = document.getElementById("btnRetry");
  const btnOverBack  = document.getElementById("btnOverBack");
  const btnGameBack  = document.getElementById("btnGameBack");
  const gameScoreEl  = document.getElementById("gameScore");
  const finalScoreEl = document.getElementById("finalScore");
  const finalScoreUnit= document.getElementById("finalScoreUnit");
  const overEmoji    = document.getElementById("overEmoji");
  const overTitle    = document.getElementById("overTitle");
  const gameWalletEl = document.getElementById("gameWallet");

  // Registro de juegos. Cada uno expone start(ctx, W, H) y stop().
  const GAMES_META = [
    { id: "runner",  name: "Runner",  emoji: "🏎️", desc: "Esquiva coches" },
    { id: "parking", name: "Parking", emoji: "🅿️",  desc: "Recuerda dónde iban" },
    { id: "race",    name: "Carrera", emoji: "🏁", desc: "Toca para acelerar" }
  ];
  const GAMES = {}; // id -> { start, stop, onPointerDown }
  let activeGameId = null;
  let canvasW = 0, canvasH = 0;

  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(320, rect.width  || window.innerWidth);
    const h = Math.max(480, rect.height || window.innerHeight);
    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvasW = w; canvasH = h;
  }

  function enterGameScreen() {
    fitCanvas();
    gameWalletEl.textContent = state.coins;
    renderPicker();
    showOverlay("picker");
    ctx.clearRect(0, 0, canvasW, canvasH);
  }

  function leaveGameScreen() { stopActiveGame(); }

  function renderPicker() {
    gamePicker.innerHTML = "";
    const canPlay = state.coins > 0;
    noCoinsHint.style.display = canPlay ? "none" : "";
    for (const g of GAMES_META) {
      const b = document.createElement("button");
      b.className = "game-pick";
      b.disabled = !canPlay;
      b.innerHTML = `<span class="pico">${g.emoji}</span>
        <span class="pname">${g.name}</span>
        <span class="pdesc">${g.desc}</span>`;
      b.addEventListener("click", () => startGame(g.id));
      gamePicker.appendChild(b);
    }
  }

  function showOverlay(kind) {
    overlayPicker.classList.toggle("active", kind === "picker");
    overlayOver.classList.toggle("active",   kind === "over");
  }

  function startGame(gameId) {
    if (state.coins < 1) return;
    state.coins -= 1;
    saveState(state);
    renderWallet();
    gameWalletEl.textContent = state.coins;
    activeGameId = gameId;
    showOverlay(null);
    gameScoreEl.textContent = "0";
    GAMES[gameId].start();
  }

  function stopActiveGame() {
    if (!activeGameId) return;
    const g = GAMES[activeGameId];
    if (g && g.stop) g.stop();
    activeGameId = null;
  }

  function finishGame({ score, unit, won }) {
    stopActiveGame();
    finalScoreEl.textContent = score;
    finalScoreUnit.textContent = unit || "";
    overEmoji.textContent = won ? "🏆" : "💥";
    overTitle.textContent = won ? "¡Lo lograste!" : "¡Se acabó!";
    gameWalletEl.textContent = state.coins;
    const disabled = state.coins < 1;
    btnRetry.disabled = disabled;
    btnRetry.style.opacity = disabled ? "0.4" : "";
    showOverlay("over");
  }

  // Dispatch de inputs al juego activo
  canvas.addEventListener("pointerdown", e => {
    if (!activeGameId) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const g = GAMES[activeGameId];
    if (g && g.onPointerDown) g.onPointerDown(x, y);
  });
  window.addEventListener("keydown", e => {
    if (!activeGameId) return;
    const g = GAMES[activeGameId];
    if (g && g.onKeyDown) g.onKeyDown(e);
  });
  window.addEventListener("resize", () => {
    if (!screens.game.classList.contains("active")) return;
    fitCanvas();
    const g = activeGameId && GAMES[activeGameId];
    if (g && g.onResize) g.onResize();
  });

  btnRetry.addEventListener("click", () => activeGameId == null
    ? null
    : (() => {
        const id = activeGameId;
        stopActiveGame();
        activeGameId = id; // conservar
        startGame(id);
      })());
  btnOverBack.addEventListener("click", () => { stopActiveGame(); enterGameScreen(); });
  btnGameBack.addEventListener("click", () => { show("home"); });

  // Helpers compartidos de dibujo
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }
  function drawCar(cx, y, body, flip, w, h) {
    w = w || 54; h = h || 90;
    const x = cx - w/2;
    const rot = flip ? Math.PI : 0;
    ctx.save();
    ctx.translate(cx, y + h/2); ctx.rotate(rot); ctx.translate(-cx, -(y + h/2));
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(cx, y + h + 3, w*0.5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = body; roundRect(x, y + 8, w, h - 16, 10); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.25)"; roundRect(x + 6, y + h*0.3, w - 12, h*0.35, 6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.75)"; roundRect(x + 10, y + h*0.33, w - 20, h*0.22, 4); ctx.fill();
    ctx.fillStyle = "#FFEB3B";
    ctx.beginPath(); ctx.arc(x + 10, y + 12, 3, 0, Math.PI*2);
    ctx.arc(x + w - 10, y + 12, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#1a1a24";
    roundRect(x - 2, y + 20, 6, 18, 2); ctx.fill();
    roundRect(x + w - 4, y + 20, 6, 18, 2); ctx.fill();
    roundRect(x - 2, y + h - 38, 6, 18, 2); ctx.fill();
    roundRect(x + w - 4, y + h - 38, 6, 18, 2); ctx.fill();
    ctx.restore();
  }

  // ============================================================
  //  GAME: Runner (endless 3-lane)
  // ============================================================
  (() => {
    const LANES = 3, CAR_W = 54, CAR_H = 90, OBS_W = 50, OBS_H = 86;
    const COLORS = ["#4FC3F7","#66BB6A","#FFC107","#AB47BC","#FF8A5B","#F06292"];
    const s = { running:false, rafId:null, lane:1, laneX:[0,0,0], carY:0,
                obstacles:[], speed:0, distance:0, tLast:0, stripeOffset:0,
                spawnTimer:0, spawnInterval:1200 };
    function layout() {
      const roadM = Math.max(16, canvasW * 0.08);
      const roadW = canvasW - roadM * 2;
      for (let i = 0; i < LANES; i++) s.laneX[i] = roadM + roadW * (i + 0.5) / LANES;
      s.carY = canvasH - CAR_H - 40;
    }
    function start() {
      layout();
      s.lane = 1; s.obstacles = []; s.speed = 260; s.distance = 0;
      s.spawnTimer = 0; s.spawnInterval = 1200; s.stripeOffset = 0;
      s.tLast = performance.now(); s.running = true;
      s.rafId = requestAnimationFrame(loop);
    }
    function stop() {
      s.running = false;
      if (s.rafId) { cancelAnimationFrame(s.rafId); s.rafId = null; }
    }
    function loop(now) {
      if (!s.running) return;
      const dt = Math.min(0.05, (now - s.tLast) / 1000);
      s.tLast = now;
      s.distance += s.speed * dt * 0.05;
      s.speed = Math.min(560, s.speed + dt * 10);
      s.stripeOffset = (s.stripeOffset + s.speed * dt) % 40;
      s.spawnTimer += dt * 1000;
      if (s.spawnTimer >= s.spawnInterval) {
        s.spawnTimer = 0;
        s.spawnInterval = Math.max(500, 1200 - s.distance * 2);
        s.obstacles.push({ lane: Math.floor(Math.random() * LANES),
                           y: -OBS_H,
                           color: COLORS[Math.floor(Math.random() * COLORS.length)] });
      }
      for (const o of s.obstacles) o.y += s.speed * dt;
      s.obstacles = s.obstacles.filter(o => o.y < canvasH + OBS_H);
      const cx = s.laneX[s.lane];
      const car = { x: cx - CAR_W/2, y: s.carY, w: CAR_W, h: CAR_H };
      for (const o of s.obstacles) {
        const ox = s.laneX[o.lane];
        if (rectHit(car, { x: ox - OBS_W/2, y: o.y, w: OBS_W, h: OBS_H })) {
          finishGame({ score: Math.floor(s.distance), unit: "m", won: false });
          return;
        }
      }
      gameScoreEl.textContent = Math.floor(s.distance) + " m";
      draw();
      s.rafId = requestAnimationFrame(loop);
    }
    function rectHit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function draw() {
      const W = canvasW, H = canvasH;
      const roadM = Math.max(16, W * 0.08), roadW = W - roadM * 2;
      ctx.fillStyle = "#1E1E2A"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = "#2a2a3a"; ctx.fillRect(0,0,roadM,H); ctx.fillRect(W-roadM,0,roadM,H);
      ctx.fillStyle = "#3B3B4F"; ctx.fillRect(roadM,0,roadW,H);
      ctx.strokeStyle = "#FFE066"; ctx.lineWidth = 4; ctx.setLineDash([22,18]);
      for (let i = 1; i < LANES; i++) {
        const x = roadM + roadW * i / LANES;
        ctx.lineDashOffset = -s.stripeOffset;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      ctx.setLineDash([]);
      for (const o of s.obstacles) drawCar(s.laneX[o.lane], o.y, o.color, true);
      drawCar(s.laneX[s.lane], s.carY, "#E53935", false);
    }
    GAMES.runner = {
      start, stop,
      onPointerDown(x) {
        if (!s.running) return;
        if (x < canvasW / 2) { if (s.lane > 0) s.lane--; }
        else                 { if (s.lane < LANES - 1) s.lane++; }
      },
      onKeyDown(e) {
        if (!s.running) return;
        if (e.key === "ArrowLeft"  || e.key === "a") { if (s.lane > 0) s.lane--; }
        if (e.key === "ArrowRight" || e.key === "d") { if (s.lane < LANES - 1) s.lane++; }
      },
      onResize: layout
    };
  })();

  // ============================================================
  //  GAME: Parking (memoria visual)
  // ============================================================
  (() => {
    const COLORS = ["#E53935","#4FC3F7","#66BB6A","#FFC107","#AB47BC","#FF8A5B"];
    const s = {
      phase: "idle",     // 'show' | 'quiz' | 'wait'
      cars: [],          // {color, slot}
      slots: [],         // {x,y,w,h}
      cols: 2, rows: 2,
      correct: 0, asked: 0,
      targetIdx: 0,      // índice en cars al preguntar
      shuffledOrder: [],
      tShow: 0, showMs: 2500,
      feedback: null,    // {ok, slot, ts}
      rafId: null,
      running: false
    };
    function layout() {
      const W = canvasW, H = canvasH;
      const marginX = W * 0.08, marginY = H * 0.22;
      const gridW = W - marginX * 2;
      const gridH = H - marginY * 2 - 80; // reservado abajo para prompt
      const gap = 14;
      const sw = (gridW - gap * (s.cols - 1)) / s.cols;
      const sh = (gridH - gap * (s.rows - 1)) / s.rows;
      s.slots = [];
      for (let r = 0; r < s.rows; r++) {
        for (let c = 0; c < s.cols; c++) {
          s.slots.push({
            x: marginX + c * (sw + gap),
            y: marginY + r * (sh + gap),
            w: sw, h: sh
          });
        }
      }
    }
    function start() {
      s.cols = 2; s.rows = 2;
      s.correct = 0; s.asked = 0; s.feedback = null;
      layout();
      // Elegir N colores y asignarlos a slots aleatorios
      const N = s.cols * s.rows;
      const slots = Array.from({length: N}, (_, i) => i);
      shuffleInPlace(slots);
      const colors = shuffleInPlace(COLORS.slice()).slice(0, N);
      s.cars = colors.map((color, i) => ({ color, slot: slots[i] }));
      s.shuffledOrder = Array.from({length: N}, (_, i) => i);
      shuffleInPlace(s.shuffledOrder);
      s.targetIdx = 0;
      s.phase = "show";
      s.tShow = performance.now();
      s.running = true;
      s.rafId = requestAnimationFrame(loop);
    }
    function stop() {
      s.running = false;
      if (s.rafId) { cancelAnimationFrame(s.rafId); s.rafId = null; }
    }
    function shuffleInPlace(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function loop(now) {
      if (!s.running) return;
      if (s.phase === "show") {
        if (now - s.tShow >= s.showMs) s.phase = "quiz";
      }
      draw(now);
      s.rafId = requestAnimationFrame(loop);
    }
    function draw(now) {
      const W = canvasW, H = canvasH;
      ctx.fillStyle = "#1E1E2A"; ctx.fillRect(0,0,W,H);
      // Título superior "Parking"
      ctx.fillStyle = "#FFF"; ctx.font = "600 20px Fredoka, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(s.phase === "show" ? "¡Mira bien!" :
                   s.phase === "quiz" ? "¿Dónde estaba este?" : "", W/2, 60);
      // Dibujar slots
      for (let i = 0; i < s.slots.length; i++) {
        const sl = s.slots[i];
        // suelo
        ctx.fillStyle = "#2E2E3C";
        roundRect(sl.x, sl.y, sl.w, sl.h, 14); ctx.fill();
        // líneas de parking
        ctx.strokeStyle = "#FFE066"; ctx.lineWidth = 3;
        roundRect(sl.x + 4, sl.y + 4, sl.w - 8, sl.h - 8, 10); ctx.stroke();
        // feedback flash
        if (s.feedback && s.feedback.slot === i) {
          const age = now - s.feedback.ts;
          if (age < 600) {
            ctx.fillStyle = s.feedback.ok ? "rgba(102,187,106,0.55)" : "rgba(229,57,53,0.55)";
            roundRect(sl.x, sl.y, sl.w, sl.h, 14); ctx.fill();
          }
        }
        // Dibujar coches en fase show
        if (s.phase === "show") {
          const car = s.cars.find(c => c.slot === i);
          if (car) {
            const cw = Math.min(sl.w * 0.6, 70);
            const ch = cw * 1.6;
            drawCar(sl.x + sl.w/2, sl.y + (sl.h - ch)/2, car.color, false, cw, ch);
          }
        }
      }
      // Prompt (coche objetivo) abajo
      if (s.phase === "quiz" && s.targetIdx < s.cars.length) {
        const target = s.cars[s.shuffledOrder[s.targetIdx]];
        const cw = 60, ch = cw * 1.6;
        drawCar(W/2, H - 110, target.color, false, cw, ch);
      }
      // Progreso
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.font = "500 14px Fredoka, sans-serif";
      ctx.fillText((s.correct) + " / " + s.cars.length, W/2, H - 32);
    }
    function onPointerDown(x, y) {
      if (!s.running || s.phase !== "quiz") return;
      for (let i = 0; i < s.slots.length; i++) {
        const sl = s.slots[i];
        if (x >= sl.x && x <= sl.x + sl.w && y >= sl.y && y <= sl.y + sl.h) {
          const target = s.cars[s.shuffledOrder[s.targetIdx]];
          const ok = target.slot === i;
          s.feedback = { ok, slot: i, ts: performance.now() };
          if (ok) {
            s.correct++;
            s.targetIdx++;
            gameScoreEl.textContent = s.correct + "/" + s.cars.length;
            if (s.targetIdx >= s.cars.length) {
              setTimeout(() => finishGame({
                score: s.correct, unit: "/ " + s.cars.length,
                won: s.correct === s.cars.length
              }), 600);
            }
          } else {
            // Fallo: acabar ya con score parcial
            setTimeout(() => finishGame({
              score: s.correct, unit: "/ " + s.cars.length, won: false
            }), 600);
          }
          return;
        }
      }
    }
    GAMES.parking = { start, stop, onPointerDown, onResize: layout };
  })();

  // ============================================================
  //  GAME: Carrera 1 vs 1 (tap para acelerar)
  // ============================================================
  (() => {
    const s = {
      running: false, rafId: null, tLast: 0,
      playerY: 0, rivalY: 0, finishY: 0,
      playerV: 0, rivalV: 0,
      lastTap: 0,
      taps: 0,
      finished: false
    };
    function start() {
      s.playerY = canvasH - 150;
      s.rivalY  = canvasH - 150;
      s.finishY = 100;
      s.playerV = 0;
      s.rivalV  = (canvasH - 250) / 10; // llega en ~10s si no haces nada
      s.taps = 0; s.finished = false;
      s.lastTap = 0;
      s.tLast = performance.now();
      s.running = true;
      s.rafId = requestAnimationFrame(loop);
    }
    function stop() {
      s.running = false;
      if (s.rafId) { cancelAnimationFrame(s.rafId); s.rafId = null; }
    }
    function loop(now) {
      if (!s.running) return;
      const dt = Math.min(0.05, (now - s.tLast) / 1000);
      s.tLast = now;
      // Decaimiento de velocidad del jugador
      s.playerV *= Math.pow(0.3, dt); // decae rápido sin taps
      s.playerY -= s.playerV * dt;
      s.rivalY  -= s.rivalV  * dt;
      // Fin de carrera
      if (!s.finished) {
        if (s.playerY <= s.finishY) {
          s.finished = true;
          setTimeout(() => finishGame({
            score: s.taps, unit: "pulsos", won: true
          }), 400);
        } else if (s.rivalY <= s.finishY) {
          s.finished = true;
          setTimeout(() => finishGame({
            score: s.taps, unit: "pulsos", won: false
          }), 400);
        }
      }
      gameScoreEl.textContent = s.taps + " pulsos";
      draw();
      s.rafId = requestAnimationFrame(loop);
    }
    function draw() {
      const W = canvasW, H = canvasH;
      // Fondo
      ctx.fillStyle = "#1E1E2A"; ctx.fillRect(0,0,W,H);
      // Dos carriles
      const laneGap = 20;
      const laneW = (W - laneGap * 3) / 2;
      const lane1X = laneGap, lane2X = laneGap * 2 + laneW;
      ctx.fillStyle = "#3B3B4F";
      roundRect(lane1X, 20, laneW, H - 40, 12); ctx.fill();
      roundRect(lane2X, 20, laneW, H - 40, 12); ctx.fill();
      // Línea de meta
      ctx.fillStyle = "#FFE066";
      ctx.fillRect(0, s.finishY - 3, W, 6);
      // Checker
      ctx.fillStyle = "#FFF";
      for (let i = 0; i < W; i += 20) {
        if (Math.floor(i/20) % 2 === 0) ctx.fillRect(i, s.finishY - 3, 10, 6);
      }
      // Etiqueta META
      ctx.fillStyle = "#FFE066"; ctx.font = "700 16px Fredoka, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText("META", W/2, s.finishY - 10);
      // Coches
      drawCar(lane1X + laneW/2, s.playerY, "#E53935", false);
      drawCar(lane2X + laneW/2, s.rivalY,  "#4FC3F7", false);
      // Hint tap
      if (!s.finished) {
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.font = "600 18px Fredoka, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.fillText("👆 Toca rápido para acelerar", W/2, H - 20);
      }
    }
    function onPointerDown() {
      if (!s.running || s.finished) return;
      const now = performance.now();
      const dt = (now - s.lastTap) / 1000;
      s.lastTap = now;
      // Cada tap suma velocidad; taps más espaciados cuentan más (anti-mash)
      const bonus = Math.min(1, dt > 0 ? Math.min(dt, 0.4) / 0.4 : 1);
      s.playerV += 120 * (0.5 + 0.5 * bonus);
      s.playerV = Math.min(s.playerV, 400);
      s.taps++;
    }
    GAMES.race = {
      start, stop, onPointerDown,
      onKeyDown(e) {
        if (e.key === " " || e.key === "Enter") onPointerDown();
      },
      onResize: () => {}
    };
  })();

  async function loadCatalog() {
    try {
      const res = await fetch("./content/batches.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      catalog = await res.json();
    } catch (e) {
      batchGrid.innerHTML = `<div class="loading">
        No se pudo cargar el catálogo.<br>
        Sirve la carpeta con un servidor HTTP (p. ej. <code>python3 -m http.server 8080</code>).
      </div>`;
    }
  }

  (async function boot() {
    renderWallet();
    await loadCatalog();
    renderBatchGrid();
    show("home");
    if ("speechSynthesis" in window) speechSynthesis.getVoices();
    // Registrar service worker si estamos servidos vía http(s)
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  })();
})();
</script>
</body>
</html>
